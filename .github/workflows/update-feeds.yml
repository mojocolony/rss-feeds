name: Update RSS feeds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'generate_feeds.py'
      - 'tests/**'
      - '.github/workflows/update-feeds.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test generator
        run: python -m unittest discover -s tests -v

      - name: Generate feeds
        run: python generate_feeds.py

      - name: Commit updated feeds
        run: |
          git config user.name "rss-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "Update RSS feeds"
            git push
          fi
